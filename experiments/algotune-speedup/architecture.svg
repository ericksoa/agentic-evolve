<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Inter, system-ui, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#475569"/>
    </marker>
    <linearGradient id="phase1grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:0.05"/>
    </linearGradient>
    <linearGradient id="phase2grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:0.05"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="520" rx="8" fill="#0f172a"/>

  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" fill="#e2e8f0" font-size="18" font-weight="bold">AlgoTune Speedup: Two-Phase Architecture</text>

  <!-- Phase 1 Box -->
  <rect x="30" y="55" width="410" height="380" rx="8" fill="url(#phase1grad)" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="235" y="80" text-anchor="middle" fill="#60a5fa" font-size="14" font-weight="bold">Phase 1: Single-Shot Baseline</text>

  <!-- AlgoTune Tasks -->
  <rect x="55" y="100" width="150" height="50" rx="6" fill="#1e293b" stroke="#475569"/>
  <text x="130" y="122" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600">AlgoTune Tasks</text>
  <text x="130" y="138" text-anchor="middle" fill="#94a3b8" font-size="10">154 problems</text>

  <!-- Arrow -->
  <line x1="205" y1="125" x2="250" y2="125" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Subset Selection -->
  <rect x="255" y="100" width="150" height="50" rx="6" fill="#1e293b" stroke="#475569"/>
  <text x="330" y="122" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600">select_subset.py</text>
  <text x="330" y="138" text-anchor="middle" fill="#94a3b8" font-size="10">~25 high-headroom</text>

  <!-- Arrow down -->
  <line x1="330" y1="150" x2="330" y2="175" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- AlgoTune Agent -->
  <rect x="175" y="180" width="240" height="60" rx="6" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="295" y="205" text-anchor="middle" fill="#93c5fd" font-size="12" font-weight="bold">AlgoTune Agent</text>
  <text x="295" y="222" text-anchor="middle" fill="#7dd3fc" font-size="10">Claude Opus 4.6</text>

  <!-- Arrow down -->
  <line x1="295" y1="240" x2="295" y2="265" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Baseline Solutions -->
  <rect x="195" y="270" width="200" height="50" rx="6" fill="#1e293b" stroke="#22c55e" stroke-width="1.5"/>
  <text x="295" y="292" text-anchor="middle" fill="#86efac" font-size="11" font-weight="600">Baseline Solutions</text>
  <text x="295" y="308" text-anchor="middle" fill="#94a3b8" font-size="10">solutions/{task}/solver.py</text>

  <!-- Arrow down -->
  <line x1="295" y1="320" x2="295" y2="345" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Evaluate -->
  <rect x="195" y="350" width="200" height="50" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="295" y="372" text-anchor="middle" fill="#fcd34d" font-size="11" font-weight="600">evaluate_task.py</text>
  <text x="295" y="388" text-anchor="middle" fill="#94a3b8" font-size="10">AlgoTune timing_core</text>

  <!-- Phase 2 Box -->
  <rect x="460" y="55" width="410" height="380" rx="8" fill="url(#phase2grad)" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="665" y="80" text-anchor="middle" fill="#a78bfa" font-size="14" font-weight="bold">Phase 2: Evolutionary Optimization</text>

  <!-- Starter Solution -->
  <rect x="555" y="100" width="200" height="50" rx="6" fill="#1e293b" stroke="#22c55e" stroke-width="1.5"/>
  <text x="655" y="122" text-anchor="middle" fill="#86efac" font-size="11" font-weight="600">Phase 1 Baseline</text>
  <text x="655" y="138" text-anchor="middle" fill="#94a3b8" font-size="10">starter_solution</text>

  <!-- Arrow from Phase 1 solutions to Phase 2 -->
  <path d="M 395 295 Q 475 295 555 120" fill="none" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#arrow)"/>

  <!-- Arrow down -->
  <line x1="655" y1="150" x2="655" y2="175" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Evolve-SDK -->
  <rect x="535" y="180" width="240" height="80" rx="6" fill="#2d1b69" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="655" y="205" text-anchor="middle" fill="#c4b5fd" font-size="12" font-weight="bold">evolve-sdk</text>
  <text x="655" y="222" text-anchor="middle" fill="#a78bfa" font-size="10">Mutation + Crossover + Selection</text>
  <text x="655" y="238" text-anchor="middle" fill="#94a3b8" font-size="9">10 gens, pop=6, plateau=3</text>

  <!-- Loop arrow -->
  <path d="M 775 210 C 800 210 800 240 800 240 C 800 260 780 260 775 260" fill="none" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="818" y="240" fill="#a78bfa" font-size="9" text-anchor="middle">iterate</text>

  <!-- Arrow down -->
  <line x1="655" y1="260" x2="655" y2="285" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Evolved Solutions -->
  <rect x="555" y="290" width="200" height="50" rx="6" fill="#1e293b" stroke="#f97316" stroke-width="1.5"/>
  <text x="655" y="312" text-anchor="middle" fill="#fdba74" font-size="11" font-weight="600">Evolved Champions</text>
  <text x="655" y="328" text-anchor="middle" fill="#94a3b8" font-size="10">evolved/{task}/solver.py</text>

  <!-- Arrow down -->
  <line x1="655" y1="340" x2="655" y2="365" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Evaluate Phase 2 -->
  <rect x="555" y="370" width="200" height="50" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="655" y="392" text-anchor="middle" fill="#fcd34d" font-size="11" font-weight="600">evaluate_task.py</text>
  <text x="655" y="408" text-anchor="middle" fill="#94a3b8" font-size="10">Re-evaluate + variance gate</text>

  <!-- Bottom: Aggregation -->
  <rect x="250" y="450" width="400" height="55" rx="8" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="450" y="473" text-anchor="middle" fill="#67e8f9" font-size="12" font-weight="bold">aggregate_results.py</text>
  <text x="450" y="492" text-anchor="middle" fill="#94a3b8" font-size="10">Best(Phase1, Phase2) per task → Harmonic Mean Speedup</text>

  <!-- Arrows to aggregation -->
  <line x1="295" y1="400" x2="350" y2="450" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="655" y1="420" x2="550" y2="450" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
