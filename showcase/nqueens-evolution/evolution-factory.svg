<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="mutatorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e94560"/>
      <stop offset="100%" style="stop-color:#c73e54"/>
    </linearGradient>
    <linearGradient id="evaluatorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0f3460"/>
      <stop offset="100%" style="stop-color:#0a2647"/>
    </linearGradient>
    <linearGradient id="adversaryGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f39c12"/>
      <stop offset="100%" style="stop-color:#d68910"/>
    </linearGradient>
    <linearGradient id="crossoverGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#9b59b6"/>
      <stop offset="100%" style="stop-color:#8e44ad"/>
    </linearGradient>
    <linearGradient id="memoryGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1abc9c"/>
      <stop offset="100%" style="stop-color:#16a085"/>
    </linearGradient>
    <linearGradient id="championGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f1c40f"/>
      <stop offset="100%" style="stop-color:#d4ac0d"/>
    </linearGradient>
    <linearGradient id="debuggerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e74c3c"/>
      <stop offset="100%" style="stop-color:#c0392b"/>
    </linearGradient>
    <linearGradient id="plateauGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3498db"/>
      <stop offset="100%" style="stop-color:#2980b9"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="650" fill="url(#bgGrad)"/>

  <!-- Title -->
  <text x="450" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#ecf0f1">
    Evolution Factory
  </text>
  <text x="450" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#bdc3c7">
    Agentic Workers Evolving Solutions
  </text>

  <!-- Central Pipeline -->
  <rect x="300" y="250" width="300" height="100" rx="10" fill="#2c3e50" stroke="#34495e" stroke-width="2" filter="url(#shadow)"/>
  <text x="450" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ecf0f1">Population Pool</text>
  <text x="450" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#95a5a6">gen0_a, gen1a, gen2b, gen3x...</text>

  <!-- Mutator Agent (Left) -->
  <g transform="translate(50, 150)">
    <rect x="0" y="0" width="130" height="120" rx="15" fill="url(#mutatorGrad)" filter="url(#shadow)"/>
    <text x="65" y="45" text-anchor="middle" font-size="32" fill="#fff" opacity="0.9">🧬</text>
    <text x="65" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#fff">Mutator</text>
    <text x="65" y="92" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#fff" opacity="0.8">Creates variants</text>
    <text x="65" y="107" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#fff" opacity="0.8">+26% best jump</text>
  </g>

  <!-- Debugger Agent (Below Mutator) -->
  <g transform="translate(50, 290)">
    <rect x="0" y="0" width="130" height="100" rx="15" fill="url(#debuggerGrad)" filter="url(#shadow)"/>
    <text x="65" y="40" text-anchor="middle" font-size="28" fill="#fff" opacity="0.9">🐛</text>
    <text x="65" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#fff">Debugger</text>
    <text x="65" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#fff" opacity="0.8">Diagnoses failures</text>
    <text x="65" y="93" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#fff" opacity="0.8">33% catch rate</text>
  </g>

  <!-- Arrow from Mutator to Pool -->
  <path d="M180 210 L290 280" stroke="#e94560" stroke-width="3" fill="none" marker-end="url(#arrowRed)"/>
  <defs>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#e94560"/>
    </marker>
  </defs>

  <!-- Dashed arrow from failed mutations to Debugger -->
  <path d="M200 270 L180 290" stroke="#e74c3c" stroke-width="2" stroke-dasharray="4,3" fill="none" marker-end="url(#arrowDebug)"/>
  <defs>
    <marker id="arrowDebug" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#e74c3c"/>
    </marker>
  </defs>

  <!-- Evaluator Agent (Right) -->
  <g transform="translate(720, 150)">
    <rect x="0" y="0" width="130" height="120" rx="15" fill="url(#evaluatorGrad)" filter="url(#shadow)"/>
    <text x="65" y="45" text-anchor="middle" font-size="32" fill="#fff" opacity="0.9">📊</text>
    <text x="65" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#fff">Evaluator</text>
    <text x="65" y="92" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#fff" opacity="0.8">Measures fitness</text>
    <text x="65" y="107" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#fff" opacity="0.8">20,407 sol/sec</text>
  </g>

  <!-- Plateau Breaker Agent (Below Evaluator) -->
  <g transform="translate(720, 290)">
    <rect x="0" y="0" width="130" height="100" rx="15" fill="url(#plateauGrad)" filter="url(#shadow)"/>
    <text x="65" y="40" text-anchor="middle" font-size="28" fill="#fff" opacity="0.9">🔨</text>
    <text x="65" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#fff">Plateau Breaker</text>
    <text x="65" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#fff" opacity="0.8">Escapes local optima</text>
    <text x="65" y="93" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#fff" opacity="0.8">Radical interventions</text>
  </g>

  <!-- Arrow from Pool to Evaluator -->
  <path d="M610 280 L720 210" stroke="#3498db" stroke-width="3" fill="none" marker-end="url(#arrowBlue)"/>
  <defs>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#3498db"/>
    </marker>
  </defs>

  <!-- Dashed arrow from stalled evolution to Plateau Breaker -->
  <path d="M610 320 L720 340" stroke="#3498db" stroke-width="2" stroke-dasharray="4,3" fill="none" marker-end="url(#arrowPlateau)"/>
  <defs>
    <marker id="arrowPlateau" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#3498db"/>
    </marker>
  </defs>

  <!-- Adversary Agent (Top) -->
  <g transform="translate(380, 90)">
    <rect x="0" y="0" width="140" height="110" rx="15" fill="url(#adversaryGrad)" filter="url(#shadow)"/>
    <text x="70" y="42" text-anchor="middle" font-size="32" fill="#fff" opacity="0.9">🛡️</text>
    <text x="70" y="68" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#fff">Adversary</text>
    <text x="70" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#fff" opacity="0.8">Trust validation</text>
    <text x="70" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#fff" opacity="0.8">4 rejected</text>
  </g>

  <!-- Arrow from Pool to Adversary -->
  <path d="M450 250 L450 205" stroke="#f39c12" stroke-width="3" fill="none" marker-end="url(#arrowYellow)"/>
  <defs>
    <marker id="arrowYellow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#f39c12"/>
    </marker>
  </defs>

  <!-- Crossover Agent (Bottom Left) -->
  <g transform="translate(180, 420)">
    <rect x="0" y="0" width="130" height="110" rx="15" fill="url(#crossoverGrad)" filter="url(#shadow)"/>
    <text x="65" y="42" text-anchor="middle" font-size="32" fill="#fff" opacity="0.9">🔀</text>
    <text x="65" y="68" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#fff">Crossover</text>
    <text x="65" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#fff" opacity="0.8">Combines parents</text>
    <text x="65" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#fff" opacity="0.8">gen6x champion</text>
  </g>

  <!-- Arrow from Pool to Crossover -->
  <path d="M380 350 L290 430" stroke="#9b59b6" stroke-width="3" fill="none" marker-end="url(#arrowPurple)"/>
  <defs>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#9b59b6"/>
    </marker>
  </defs>

  <!-- Memory Store (Bottom Right) -->
  <g transform="translate(590, 420)">
    <rect x="0" y="0" width="130" height="110" rx="15" fill="url(#memoryGrad)" filter="url(#shadow)"/>
    <text x="65" y="42" text-anchor="middle" font-size="32" fill="#fff" opacity="0.9">💾</text>
    <text x="65" y="68" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#fff">Memory</text>
    <text x="65" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#fff" opacity="0.8">Stores patterns</text>
    <text x="65" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#fff" opacity="0.8">49 frames</text>
  </g>

  <!-- Arrow from Pool to Memory -->
  <path d="M520 350 L610 430" stroke="#1abc9c" stroke-width="3" fill="none" marker-end="url(#arrowGreen)"/>
  <defs>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#1abc9c"/>
    </marker>
  </defs>

  <!-- Champion Output (Far Right) -->
  <g transform="translate(780, 420)">
    <rect x="0" y="0" width="100" height="100" rx="50" fill="url(#championGrad)" filter="url(#shadow)"/>
    <text x="50" y="50" text-anchor="middle" font-size="36" fill="#fff" opacity="0.9">🏆</text>
    <text x="50" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#fff">Champion</text>
    <text x="50" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#8B6914">gen6x</text>
  </g>

  <!-- Stats Footer -->
  <rect x="50" y="555" width="800" height="80" rx="8" fill="#2c3e50" opacity="0.8"/>
  <text x="100" y="582" font-family="Arial, sans-serif" font-size="11" fill="#e94560">
    <tspan font-weight="bold">22 Mutations</tspan>
  </text>
  <text x="210" y="582" font-family="Arial, sans-serif" font-size="11" fill="#e74c3c">
    <tspan font-weight="bold">33% Diagnosed</tspan>
  </text>
  <text x="330" y="582" font-family="Arial, sans-serif" font-size="11" fill="#3498db">
    <tspan font-weight="bold">40 Evaluations</tspan>
  </text>
  <text x="460" y="582" font-family="Arial, sans-serif" font-size="11" fill="#f39c12">
    <tspan font-weight="bold">4 Rejected</tspan>
  </text>
  <text x="100" y="612" font-family="Arial, sans-serif" font-size="11" fill="#9b59b6">
    <tspan font-weight="bold">10 Crossovers</tspan>
  </text>
  <text x="210" y="612" font-family="Arial, sans-serif" font-size="11" fill="#1abc9c">
    <tspan font-weight="bold">49 Frames</tspan>
  </text>
  <text x="330" y="612" font-family="Arial, sans-serif" font-size="11" fill="#2980b9">
    <tspan font-weight="bold">1 Plateau Broken</tspan>
  </text>
  <text x="480" y="612" font-family="Arial, sans-serif" font-size="11" fill="#f1c40f">
    <tspan font-weight="bold">14,000x Speedup</tspan>
  </text>

  <!-- Connecting lines showing data flow -->
  <path d="M320 480 Q450 540 580 480" stroke="#95a5a6" stroke-width="1" stroke-dasharray="5,5" fill="none" opacity="0.5"/>

</svg>
