<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="mutatorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e94560"/>
      <stop offset="100%" style="stop-color:#c73e54"/>
    </linearGradient>
    <linearGradient id="evaluatorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0f3460"/>
      <stop offset="100%" style="stop-color:#0a2647"/>
    </linearGradient>
    <linearGradient id="adversaryGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f39c12"/>
      <stop offset="100%" style="stop-color:#d68910"/>
    </linearGradient>
    <linearGradient id="crossoverGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#9b59b6"/>
      <stop offset="100%" style="stop-color:#8e44ad"/>
    </linearGradient>
    <linearGradient id="memoryGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1abc9c"/>
      <stop offset="100%" style="stop-color:#16a085"/>
    </linearGradient>
    <linearGradient id="championGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f1c40f"/>
      <stop offset="100%" style="stop-color:#d4ac0d"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>

    <!-- Glow effect -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="600" fill="url(#bgGrad)"/>

  <!-- Title -->
  <text x="450" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#ecf0f1">
    Evolution Factory
  </text>
  <text x="450" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#bdc3c7">
    Agentic Workers Evolving Solutions
  </text>

  <!-- Central Pipeline -->
  <rect x="300" y="250" width="300" height="100" rx="10" fill="#2c3e50" stroke="#34495e" stroke-width="2" filter="url(#shadow)"/>
  <text x="450" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ecf0f1">Population Pool</text>
  <text x="450" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#95a5a6">gen0_a, gen1a, gen2b, gen3x...</text>

  <!-- Mutator Agent (Left) -->
  <g transform="translate(80, 180)">
    <rect x="0" y="0" width="140" height="140" rx="15" fill="url(#mutatorGrad)" filter="url(#shadow)"/>
    <!-- Robot icon -->
    <circle cx="70" cy="45" r="25" fill="#fff" opacity="0.2"/>
    <rect x="50" y="30" width="40" height="35" rx="5" fill="#fff" opacity="0.9"/>
    <circle cx="60" cy="42" r="5" fill="#e94560"/>
    <circle cx="80" cy="42" r="5" fill="#e94560"/>
    <rect x="55" y="52" width="30" height="8" rx="2" fill="#e94560"/>
    <!-- Wrench icon -->
    <path d="M90 70 L100 80 L95 85 L85 75 Z" fill="#fff" opacity="0.7"/>
    <text x="70" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#fff">Mutator</text>
    <text x="70" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#fff" opacity="0.8">Creates variants</text>
    <text x="70" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#fff" opacity="0.8">+26% best jump</text>
  </g>

  <!-- Arrow from Mutator to Pool -->
  <path d="M220 250 L290 280" stroke="#e94560" stroke-width="3" fill="none" marker-end="url(#arrowRed)"/>
  <defs>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#e94560"/>
    </marker>
  </defs>

  <!-- Evaluator Agent (Right) -->
  <g transform="translate(680, 180)">
    <rect x="0" y="0" width="140" height="140" rx="15" fill="url(#evaluatorGrad)" filter="url(#shadow)"/>
    <!-- Clipboard icon -->
    <rect x="50" y="25" width="40" height="50" rx="3" fill="#fff" opacity="0.9"/>
    <rect x="45" y="20" width="50" height="12" rx="3" fill="#fff" opacity="0.7"/>
    <line x1="55" y1="40" x2="85" y2="40" stroke="#0f3460" stroke-width="2"/>
    <line x1="55" y1="50" x2="85" y2="50" stroke="#0f3460" stroke-width="2"/>
    <line x1="55" y1="60" x2="75" y2="60" stroke="#0f3460" stroke-width="2"/>
    <!-- Checkmark -->
    <path d="M78 55 L82 62 L92 48" stroke="#27ae60" stroke-width="3" fill="none"/>
    <text x="70" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#fff">Evaluator</text>
    <text x="70" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#fff" opacity="0.8">Measures fitness</text>
    <text x="70" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#fff" opacity="0.8">20,407 sol/sec</text>
  </g>

  <!-- Arrow from Pool to Evaluator -->
  <path d="M610 280 L680 250" stroke="#3498db" stroke-width="3" fill="none" marker-end="url(#arrowBlue)"/>
  <defs>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#3498db"/>
    </marker>
  </defs>

  <!-- Adversary Agent (Top) -->
  <g transform="translate(380, 90)">
    <rect x="0" y="0" width="140" height="120" rx="15" fill="url(#adversaryGrad)" filter="url(#shadow)"/>
    <!-- Shield icon -->
    <path d="M70 25 L95 35 L95 60 Q95 80 70 90 Q45 80 45 60 L45 35 Z" fill="#fff" opacity="0.9"/>
    <path d="M60 55 L68 65 L85 45" stroke="#f39c12" stroke-width="4" fill="none"/>
    <text x="70" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#fff">Adversary</text>
    <text x="70" y="92" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#fff" opacity="0.8">Trust validation</text>
    <text x="70" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#fff" opacity="0.8">4 rejected</text>
  </g>

  <!-- Arrow from Pool to Adversary -->
  <path d="M450 250 L450 215" stroke="#f39c12" stroke-width="3" fill="none" marker-end="url(#arrowYellow)"/>
  <defs>
    <marker id="arrowYellow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#f39c12"/>
    </marker>
  </defs>

  <!-- Crossover Agent (Bottom Left) -->
  <g transform="translate(180, 400)">
    <rect x="0" y="0" width="140" height="120" rx="15" fill="url(#crossoverGrad)" filter="url(#shadow)"/>
    <!-- DNA helix icon -->
    <ellipse cx="55" cy="45" rx="15" ry="8" fill="#fff" opacity="0.8" transform="rotate(-20 55 45)"/>
    <ellipse cx="85" cy="45" rx="15" ry="8" fill="#fff" opacity="0.8" transform="rotate(20 85 45)"/>
    <ellipse cx="55" cy="60" rx="15" ry="8" fill="#fff" opacity="0.6" transform="rotate(20 55 60)"/>
    <ellipse cx="85" cy="60" rx="15" ry="8" fill="#fff" opacity="0.6" transform="rotate(-20 85 60)"/>
    <line x1="55" y1="45" x2="85" y2="45" stroke="#fff" stroke-width="2" opacity="0.5"/>
    <line x1="55" y1="60" x2="85" y2="60" stroke="#fff" stroke-width="2" opacity="0.5"/>
    <text x="70" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#fff">Crossover</text>
    <text x="70" y="97" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#fff" opacity="0.8">Combines parents</text>
    <text x="70" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#fff" opacity="0.8">gen6x champion</text>
  </g>

  <!-- Arrow from Pool to Crossover -->
  <path d="M380 350 L300 420" stroke="#9b59b6" stroke-width="3" fill="none" marker-end="url(#arrowPurple)"/>
  <defs>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#9b59b6"/>
    </marker>
  </defs>

  <!-- Memory Store (Bottom Right) -->
  <g transform="translate(580, 400)">
    <rect x="0" y="0" width="140" height="120" rx="15" fill="url(#memoryGrad)" filter="url(#shadow)"/>
    <!-- Database icon -->
    <ellipse cx="70" cy="35" rx="30" ry="10" fill="#fff" opacity="0.9"/>
    <path d="M40 35 L40 65 Q40 75 70 75 Q100 75 100 65 L100 35" fill="#fff" opacity="0.7"/>
    <ellipse cx="70" cy="65" rx="30" ry="10" fill="#fff" opacity="0.5"/>
    <line x1="50" y1="45" x2="90" y2="45" stroke="#1abc9c" stroke-width="2"/>
    <line x1="50" y1="55" x2="90" y2="55" stroke="#1abc9c" stroke-width="2"/>
    <text x="70" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#fff">Memory</text>
    <text x="70" y="97" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#fff" opacity="0.8">Stores patterns</text>
    <text x="70" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#fff" opacity="0.8">49 frames</text>
  </g>

  <!-- Arrow from Pool to Memory -->
  <path d="M520 350 L600 420" stroke="#1abc9c" stroke-width="3" fill="none" marker-end="url(#arrowGreen)"/>
  <defs>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#1abc9c"/>
    </marker>
  </defs>

  <!-- Champion Output (Far Right) -->
  <g transform="translate(780, 380)">
    <rect x="0" y="0" width="100" height="100" rx="50" fill="url(#championGrad)" filter="url(#shadow)"/>
    <!-- Trophy icon -->
    <path d="M50 30 L65 30 L65 45 Q65 60 50 65 Q35 60 35 45 L35 30 Z" fill="#fff" opacity="0.9"/>
    <rect x="45" y="65" width="10" height="8" fill="#fff" opacity="0.8"/>
    <rect x="40" y="73" width="20" height="5" rx="2" fill="#fff" opacity="0.8"/>
    <path d="M30 35 Q20 35 20 45 Q20 50 30 50" fill="none" stroke="#fff" stroke-width="3" opacity="0.7"/>
    <path d="M70 35 Q80 35 80 45 Q80 50 70 50" fill="none" stroke="#fff" stroke-width="3" opacity="0.7"/>
    <text x="50" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#d4ac0d">gen6x</text>
  </g>

  <!-- Stats Footer -->
  <rect x="50" y="545" width="800" height="45" rx="8" fill="#2c3e50" opacity="0.8"/>
  <text x="100" y="572" font-family="Arial, sans-serif" font-size="12" fill="#e94560">
    <tspan font-weight="bold">22 Mutations</tspan>
  </text>
  <text x="230" y="572" font-family="Arial, sans-serif" font-size="12" fill="#3498db">
    <tspan font-weight="bold">40 Evaluations</tspan>
  </text>
  <text x="370" y="572" font-family="Arial, sans-serif" font-size="12" fill="#f39c12">
    <tspan font-weight="bold">4 Rejected</tspan>
  </text>
  <text x="490" y="572" font-family="Arial, sans-serif" font-size="12" fill="#9b59b6">
    <tspan font-weight="bold">10 Crossovers</tspan>
  </text>
  <text x="620" y="572" font-family="Arial, sans-serif" font-size="12" fill="#1abc9c">
    <tspan font-weight="bold">49 Frames</tspan>
  </text>
  <text x="740" y="572" font-family="Arial, sans-serif" font-size="12" fill="#f1c40f">
    <tspan font-weight="bold">14,000x Speedup</tspan>
  </text>

  <!-- Connecting lines showing data flow -->
  <path d="M320 460 Q450 520 580 460" stroke="#95a5a6" stroke-width="1" stroke-dasharray="5,5" fill="none" opacity="0.5"/>

</svg>
