<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="600" fill="#1a1a2e"/>

  <!-- Evolution Loop Border -->
  <rect x="40" y="30" width="620" height="300" rx="20" fill="none" stroke="#4a5568" stroke-width="2" stroke-dasharray="10,5"/>
  <text x="350" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#718096">EVOLUTION LOOP</text>

  <!-- Initializer -->
  <rect x="60" y="70" width="110" height="45" rx="8" fill="#8b5cf6" filter="url(#shadow)"/>
  <text x="115" y="98" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Initializer</text>

  <!-- Population Pool -->
  <rect x="60" y="135" width="580" height="55" rx="8" fill="#4a5568" filter="url(#shadow)"/>
  <text x="350" y="168" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">Population Pool</text>

  <!-- Arrow: Initializer → Population -->
  <path d="M115 115 L115 135" stroke="#718096" stroke-width="2" fill="none"/>

  <!-- Core Agents Row -->
  <!-- Mutator -->
  <rect x="60" y="220" width="120" height="50" rx="8" fill="#ef4444" filter="url(#shadow)"/>
  <text x="120" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Mutator</text>

  <!-- Crossover -->
  <rect x="200" y="220" width="120" height="50" rx="8" fill="#a855f7" filter="url(#shadow)"/>
  <text x="260" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Crossover</text>

  <!-- Evaluator -->
  <rect x="340" y="220" width="120" height="50" rx="8" fill="#1e40af" filter="url(#shadow)"/>
  <text x="400" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Evaluator</text>

  <!-- Adversary -->
  <rect x="480" y="220" width="120" height="50" rx="8" fill="#f97316" filter="url(#shadow)"/>
  <text x="540" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Adversary</text>

  <!-- Arrows: Population → Agents -->
  <path d="M120 190 L120 220" stroke="#718096" stroke-width="2" fill="none"/>
  <path d="M260 190 L260 220" stroke="#718096" stroke-width="2" fill="none"/>
  <path d="M400 190 L400 220" stroke="#718096" stroke-width="2" fill="none"/>
  <path d="M540 190 L540 220" stroke="#718096" stroke-width="2" fill="none"/>

  <!-- Arrow: Loop back from agents to Population -->
  <path d="M60 245 L30 245 L30 162 L60 162" stroke="#718096" stroke-width="2" fill="none"/>

  <!-- Champion -->
  <circle cx="760" cy="180" r="55" fill="#eab308" filter="url(#shadow)"/>
  <text x="760" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1a1a2e">Champion</text>

  <!-- Arrow: Adversary → Champion -->
  <path d="M600 245 L660 245 Q685 245 685 220 L685 180 L705 180" stroke="#718096" stroke-width="2" fill="none"/>
  <text x="670" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#a3a3a3">validated</text>

  <!-- Diagnostic Agents Section -->
  <rect x="40" y="380" width="380" height="100" rx="12" fill="#2d3748"/>
  <text x="230" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#718096">DIAGNOSTIC AGENTS</text>

  <!-- Debugger -->
  <rect x="60" y="420" width="100" height="45" rx="8" fill="#dc2626" filter="url(#shadow)"/>
  <text x="110" y="448" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">Debugger</text>

  <!-- Plateau Breaker -->
  <rect x="180" y="420" width="100" height="45" rx="8" fill="#2563eb" filter="url(#shadow)"/>
  <text x="230" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">Plateau</text>
  <text x="230" y="455" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">Breaker</text>

  <!-- Meta-Strategist -->
  <rect x="300" y="420" width="100" height="45" rx="8" fill="#7c3aed" filter="url(#shadow)"/>
  <text x="350" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">Meta-</text>
  <text x="350" y="455" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">Strategist</text>

  <!-- Support Systems Section -->
  <rect x="450" y="380" width="280" height="100" rx="12" fill="#2d3748"/>
  <text x="590" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#718096">SUPPORT SYSTEMS</text>

  <!-- Memory System -->
  <rect x="470" y="420" width="110" height="45" rx="8" fill="#0d9488" filter="url(#shadow)"/>
  <text x="525" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">Memory</text>
  <text x="525" y="455" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">System</text>

  <!-- Trust Validation -->
  <rect x="600" y="420" width="110" height="45" rx="8" fill="#ea580c" filter="url(#shadow)"/>
  <text x="655" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">Trust</text>
  <text x="655" y="455" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">Validation</text>

  <!-- Context Injection Arrow: Memory → Mutator -->
  <path d="M525 420 L525 350 L120 350 L120 270" stroke="#14b8a6" stroke-width="2" stroke-dasharray="6,3" fill="none"/>
  <text x="320" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-style="italic" fill="#14b8a6">context injection</text>

  <!-- Decorative stars -->
  <polygon points="850,450 853,460 863,460 855,467 858,477 850,471 842,477 845,467 837,460 847,460" fill="#4a5568"/>
  <polygon points="820,520 822,527 829,527 824,532 826,539 820,535 814,539 816,532 811,527 818,527" fill="#4a5568"/>

</svg>
