<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="mutatorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e94560"/>
      <stop offset="100%" style="stop-color:#c73e54"/>
    </linearGradient>
    <linearGradient id="evaluatorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0f3460"/>
      <stop offset="100%" style="stop-color:#0a2647"/>
    </linearGradient>
    <linearGradient id="adversaryGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f39c12"/>
      <stop offset="100%" style="stop-color:#d68910"/>
    </linearGradient>
    <linearGradient id="crossoverGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#9b59b6"/>
      <stop offset="100%" style="stop-color:#8e44ad"/>
    </linearGradient>
    <linearGradient id="memoryGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1abc9c"/>
      <stop offset="100%" style="stop-color:#16a085"/>
    </linearGradient>
    <linearGradient id="debuggerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e74c3c"/>
      <stop offset="100%" style="stop-color:#c0392b"/>
    </linearGradient>
    <linearGradient id="plateauGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3498db"/>
      <stop offset="100%" style="stop-color:#2980b9"/>
    </linearGradient>
    <linearGradient id="reporterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#27ae60"/>
      <stop offset="100%" style="stop-color:#1e8449"/>
    </linearGradient>
    <linearGradient id="initGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8e44ad"/>
      <stop offset="100%" style="stop-color:#7d3c98"/>
    </linearGradient>
    <linearGradient id="strategistGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#9b59b6"/>
      <stop offset="100%" style="stop-color:#6c3483"/>
    </linearGradient>
    <linearGradient id="championGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f1c40f"/>
      <stop offset="100%" style="stop-color:#d4ac0d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
    <marker id="arrowGray" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#95a5a6"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#1abc9c"/>
    </marker>
    <marker id="arrowGold" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#f1c40f"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="850" fill="url(#bgGrad)"/>

  <!-- Title -->
  <text x="600" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#ecf0f1">Evolve SDK Architecture</text>
  <text x="600" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#bdc3c7">Hierarchical agents with clean context, memory persistence, and trust validation</text>

  <!-- ==================== ROW 1: Initializer and Population ==================== -->

  <!-- Initializer -->
  <g transform="translate(80, 100)">
    <rect x="0" y="0" width="140" height="80" rx="12" fill="url(#initGrad)" filter="url(#shadow)"/>
    <text x="70" y="30" text-anchor="middle" font-size="24" fill="#fff">🌱</text>
    <text x="70" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#fff">Initializer</text>
    <text x="70" y="68" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#fff" opacity="0.9">Creates Gen 0 population</text>
  </g>

  <!-- Arrow: Initializer → Population -->
  <path d="M220 140 L300 140" stroke="#8e44ad" stroke-width="2" fill="none" marker-end="url(#arrowGray)"/>

  <!-- Population Pool -->
  <g transform="translate(310, 100)">
    <rect x="0" y="0" width="280" height="80" rx="10" fill="#2c3e50" stroke="#ecf0f1" stroke-width="2" filter="url(#shadow)"/>
    <text x="140" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ecf0f1">Population Pool</text>
    <text x="140" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#95a5a6">gen0_a.py, gen1a.py, gen2b.py, gen3x.py...</text>
    <text x="140" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#7f8c8d">Ranked by fitness • Selection pressure</text>
  </g>

  <!-- ==================== ROW 2: Core Agents (Mutator, Crossover, Evaluator) ==================== -->

  <!-- Mutator -->
  <g transform="translate(80, 220)">
    <rect x="0" y="0" width="140" height="100" rx="12" fill="url(#mutatorGrad)" filter="url(#shadow)"/>
    <text x="70" y="30" text-anchor="middle" font-size="22" fill="#fff">🧬</text>
    <text x="70" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#fff">Mutator</text>
    <text x="70" y="68" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#fff" opacity="0.9">Parallel (3-4x)</text>
    <text x="70" y="82" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#fff" opacity="0.9">Clean context each</text>
  </g>

  <!-- Crossover -->
  <g transform="translate(250, 220)">
    <rect x="0" y="0" width="140" height="100" rx="12" fill="url(#crossoverGrad)" filter="url(#shadow)"/>
    <text x="70" y="30" text-anchor="middle" font-size="22" fill="#fff">🔀</text>
    <text x="70" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#fff">Crossover</text>
    <text x="70" y="68" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#fff" opacity="0.9">Combines top 2-3</text>
    <text x="70" y="82" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#fff" opacity="0.9">Creates genXx hybrids</text>
  </g>

  <!-- Evaluator -->
  <g transform="translate(420, 220)">
    <rect x="0" y="0" width="140" height="100" rx="12" fill="url(#evaluatorGrad)" filter="url(#shadow)"/>
    <text x="70" y="30" text-anchor="middle" font-size="22" fill="#fff">📊</text>
    <text x="70" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#fff">Evaluator</text>
    <text x="70" y="68" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#fff" opacity="0.9">Runs test harness</text>
    <text x="70" y="82" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#fff" opacity="0.9">perf/size/ml metrics</text>
  </g>

  <!-- Arrows: Population → Agents -->
  <path d="M380 180 L150 220" stroke="#95a5a6" stroke-width="2" fill="none" marker-end="url(#arrowGray)"/>
  <path d="M450 180 L320 220" stroke="#95a5a6" stroke-width="2" fill="none" marker-end="url(#arrowGray)"/>
  <path d="M520 180 L490 220" stroke="#95a5a6" stroke-width="2" fill="none" marker-end="url(#arrowGray)"/>

  <!-- ==================== CHAMPION (clear space on right of row 2) ==================== -->

  <g transform="translate(620, 220)">
    <rect x="0" y="0" width="100" height="100" rx="50" fill="url(#championGrad)" filter="url(#shadow)"/>
    <text x="50" y="40" text-anchor="middle" font-size="32" fill="#fff">🏆</text>
    <text x="50" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#fff">Champion</text>
    <text x="50" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#8B6914">Best solution</text>
  </g>

  <!-- Arrow: Evaluator → Champion -->
  <path d="M560 270 L620 270" stroke="#f1c40f" stroke-width="2" fill="none" marker-end="url(#arrowGold)"/>
  <text x="590" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#f1c40f">after trust</text>

  <!-- ==================== ROW 3: Diagnostic Agents ==================== -->

  <text x="600" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#7f8c8d">DIAGNOSTIC AGENTS (triggered on conditions)</text>

  <!-- Debugger -->
  <g transform="translate(80, 390)">
    <rect x="0" y="0" width="160" height="80" rx="12" fill="url(#debuggerGrad)" filter="url(#shadow)"/>
    <text x="80" y="28" text-anchor="middle" font-size="20" fill="#fff">🐛</text>
    <text x="80" y="46" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#fff">Debugger</text>
    <text x="80" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#fff" opacity="0.9">On crash/error/timeout</text>
    <text x="80" y="74" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#fff" opacity="0.9">33% diagnosis rate</text>
  </g>

  <!-- Plateau Breaker -->
  <g transform="translate(270, 390)">
    <rect x="0" y="0" width="160" height="80" rx="12" fill="url(#plateauGrad)" filter="url(#shadow)"/>
    <text x="80" y="28" text-anchor="middle" font-size="20" fill="#fff">🔨</text>
    <text x="80" y="46" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#fff">Plateau Breaker</text>
    <text x="80" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#fff" opacity="0.9">On stall (&lt;2% / 3 gens)</text>
    <text x="80" y="74" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#fff" opacity="0.9">Radical interventions</text>
  </g>

  <!-- Meta-Strategist -->
  <g transform="translate(460, 390)">
    <rect x="0" y="0" width="160" height="80" rx="12" fill="url(#strategistGrad)" filter="url(#shadow)"/>
    <text x="80" y="28" text-anchor="middle" font-size="20" fill="#fff">🎯</text>
    <text x="80" y="46" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#fff">Meta-Strategist</text>
    <text x="80" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#fff" opacity="0.9">Every N generations</text>
    <text x="80" y="74" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#fff" opacity="0.9">Adjusts mutation weights</text>
  </g>

  <!-- Adversary -->
  <g transform="translate(650, 390)">
    <rect x="0" y="0" width="160" height="80" rx="12" fill="url(#adversaryGrad)" filter="url(#shadow)"/>
    <text x="80" y="28" text-anchor="middle" font-size="20" fill="#fff">🛡️</text>
    <text x="80" y="46" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#fff">Adversary</text>
    <text x="80" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#fff" opacity="0.9">Reviews &gt;15% jumps</text>
    <text x="80" y="74" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#fff" opacity="0.9">Trust score 0-1</text>
  </g>

  <!-- ==================== ROW 4: Support Systems ==================== -->

  <text x="600" y="520" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#7f8c8d">SUPPORT SYSTEMS</text>

  <!-- Trust System Box -->
  <g transform="translate(80, 540)">
    <rect x="0" y="0" width="340" height="120" rx="12" fill="#34495e" opacity="0.5" stroke="#f39c12" stroke-width="1"/>
    <text x="170" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#f39c12">TRUST SYSTEM</text>
    <text x="170" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#bdc3c7">1. Exploit detection (timing, output)</text>
    <text x="170" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#bdc3c7">2. Variance gate (N re-evaluations)</text>
    <text x="170" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#bdc3c7">3. Adversary review (suspicious?)</text>
    <text x="170" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#bdc3c7">4. Escalation levels (L1-L3)</text>
    <text x="170" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#95a5a6">→ Generates trust_dossier.md</text>
  </g>

  <!-- Memory System Box -->
  <g transform="translate(440, 540)">
    <rect x="0" y="0" width="340" height="120" rx="12" fill="#34495e" opacity="0.5" stroke="#1abc9c" stroke-width="1"/>
    <text x="170" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1abc9c">MEMORY SYSTEM</text>
    <text x="170" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#bdc3c7">• mutation (success + fitness delta)</text>
    <text x="170" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#bdc3c7">• failed_mutation (why it broke)</text>
    <text x="170" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#bdc3c7">• checkpoint (crash recovery)</text>
    <text x="170" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#bdc3c7">• champion (winning solutions)</text>
    <text x="170" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#95a5a6">→ Injected as context for mutators</text>
  </g>

  <!-- Reporter Box -->
  <g transform="translate(800, 540)">
    <rect x="0" y="0" width="320" height="120" rx="12" fill="#34495e" opacity="0.5" stroke="#27ae60" stroke-width="1"/>
    <text x="160" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#27ae60">HUMAN INTERFACE</text>
    <text x="160" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#bdc3c7">🏆 milestone (new champion)</text>
    <text x="160" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#bdc3c7">💡 discovery (share insights)</text>
    <text x="160" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#bdc3c7">⚠️ warning (suspicious activity)</text>
    <text x="160" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#bdc3c7">📊 status (progress updates)</text>
    <text x="160" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#95a5a6">→ Filtered by priority level</text>
  </g>

  <!-- Memory injection arrow -->
  <path d="M610 540 L320 320" stroke="#1abc9c" stroke-width="2" stroke-dasharray="5,3" fill="none" marker-end="url(#arrowGreen)"/>
  <text x="420" y="410" font-family="Arial, sans-serif" font-size="9" fill="#1abc9c">Context injection</text>

  <!-- ==================== FOOTER ==================== -->
  <rect x="80" y="690" width="1040" height="35" rx="8" fill="#2c3e50" opacity="0.8"/>
  <text x="200" y="712" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#ecf0f1">
    <tspan font-weight="bold">Clean Context:</tspan> Each agent sees only its task
  </text>
  <text x="480" y="712" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#ecf0f1">
    <tspan font-weight="bold">Parallel:</tspan> 3-4 mutators run concurrently
  </text>
  <text x="760" y="712" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#ecf0f1">
    <tspan font-weight="bold">Stop:</tspan> Plateau, max generations, or budget
  </text>
  <text x="1000" y="712" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#ecf0f1">
    <tspan font-weight="bold">Recovery:</tspan> Checkpoint resume
  </text>

</svg>
